<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>รายการลูกค้า</title>
<style>
  :root{
    --bg:#f7f5f2;
    --card:#ffffff;
    --border:#e0ddd6;
    --text:#2c2c2a;
    --text-secondary:#6b6b66;
    --text-muted:#9a9a94;
    --accent:#9c2b2b;
    --accent-text:#ffffff;
    --radius:10px;
    --status-progress:#b7791f;
    --status-progress-bg:#fbf0da;
    --status-shipped:#2b6cb0;
    --status-shipped-bg:#e3edf9;
    --status-paid:#2f855a;
    --status-paid-bg:#e2f3ea;
    --status-cancelled:#742a2a;
    --status-cancelled-bg:#f3e2e2;
    --status-done:#2f855a;
    --status-done-bg:#e2f3ea;
    --status-pending:#8a8a84;
    --status-pending-bg:#ececE6;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    padding:24px 16px 60px;
    background:var(--bg);
    color:var(--text);
    font-family:"Segoe UI","Tahoma","Leelawadee UI","Noto Sans Thai",sans-serif;
  }
  .container{max-width:820px;margin:0 auto;}
  .top-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .back-link{font-size:13px;color:var(--text-secondary);text-decoration:none;}
  .back-link:hover{color:var(--accent);}
  h1{font-size:18px;font-weight:600;margin:0 0 4px;text-align:center;}
  .subtitle{font-size:13px;color:var(--text-secondary);text-align:center;margin:0 0 20px;}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(76px,1fr));gap:8px;margin-bottom:18px;}
  .stat-card{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:10px 8px;text-align:center;
  }
  .stat-value{font-size:18px;font-weight:600;}
  .stat-label{font-size:11px;color:var(--text-secondary);margin-top:2px;}
  .revenue-card{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:14px;text-align:center;margin-bottom:18px;
  }
  .revenue-label{font-size:12px;color:var(--text-secondary);}
  .revenue-hint{font-size:11px;color:var(--text-muted);margin-top:2px;}
  .revenue-value{font-size:24px;font-weight:700;color:var(--accent);margin-top:2px;}
  .controls{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;align-items:center;}
  #searchInput{
    flex:1;min-width:160px;padding:10px 12px;border:1px solid var(--border);
    border-radius:var(--radius);background:var(--card);color:var(--text);
    font-size:14px;font-family:inherit;
  }
  #searchInput:focus{outline:none;border-color:var(--accent);}
  .filter-row{display:flex;flex-wrap:wrap;gap:6px;}
  .filter-select{
    padding:8px 10px;border-radius:20px;border:1px solid var(--border);
    background:var(--card);color:var(--text-secondary);font-size:12px;cursor:pointer;
    font-family:inherit;
  }
  .filter-select:focus{outline:none;border-color:var(--accent);}
  .sort-btn{
    padding:8px 12px;border-radius:20px;border:1px solid var(--border);
    background:var(--card);color:var(--text-secondary);font-size:12px;cursor:pointer;font-family:inherit;
  }
  .order-list{display:flex;flex-direction:column;gap:12px;margin-bottom:20px;}
  .order-card{
    background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;
  }
  .order-top{margin-bottom:8px;}
  .order-meta{display:flex;align-items:baseline;gap:8px;margin-bottom:8px;}
  .order-seq{font-size:13px;font-weight:600;color:var(--text);}
  .order-date{font-size:11px;color:var(--text-muted);}
  .badge-row{display:flex;flex-wrap:wrap;gap:6px;}
  .status-badge{
    font-size:11px;padding:4px 10px;border-radius:20px;font-weight:600;white-space:nowrap;
  }
  .status-badge.order-in_progress{color:var(--status-progress);background:var(--status-progress-bg);}
  .status-badge.order-done{color:var(--status-done);background:var(--status-done-bg);}
  .status-badge.order-cancelled{color:var(--status-cancelled);background:var(--status-cancelled-bg);}
  .status-badge.payment-paid{color:var(--status-paid);background:var(--status-paid-bg);}
  .status-badge.payment-unpaid{color:var(--status-pending);background:var(--status-pending-bg);}
  .status-badge.shipping-shipped{color:var(--status-shipped);background:var(--status-shipped-bg);}
  .status-badge.shipping-not_shipped{color:var(--status-pending);background:var(--status-pending-bg);}
  .order-body{display:flex;gap:12px;margin-bottom:10px;}
  .order-thumb{
    width:88px;height:88px;border-radius:8px;object-fit:cover;flex-shrink:0;
    border:1px solid var(--border);cursor:pointer;background:var(--bg);
  }
  .order-info{flex:1;min-width:0;}
  .order-name{font-size:15px;font-weight:600;margin:0 0 4px;word-break:break-word;}
  .order-branch{font-size:12px;color:var(--text-secondary);margin:0 0 4px;}
  .order-contact{font-size:11px;color:var(--text-secondary);margin:0 0 4px;word-break:break-word;}
  .order-items{font-size:11px;color:var(--text-muted);margin:0 0 6px;word-break:break-word;}
  .order-total{font-size:15px;font-weight:600;color:var(--accent);margin:0;}
  .order-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .status-select{
    flex:1 1 110px;min-width:110px;padding:8px 8px;border:1px solid var(--border);border-radius:8px;
    background:var(--bg);color:var(--text);font-size:12px;font-family:inherit;
  }
  .icon-btn{
    padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--card);
    color:var(--text-secondary);font-size:12px;cursor:pointer;font-family:inherit;
  }
  .icon-btn:active{transform:scale(0.97);}
  .icon-btn.danger{color:var(--accent);}
  .icon-btn.primary-btn{background:var(--accent);color:var(--accent-text);border-color:var(--accent);}
  .empty-state{font-size:13px;color:var(--text-muted);text-align:center;padding:40px 0;}
  .clear-all-row{text-align:center;margin-top:24px;}
  .clear-all-row button{
    font-size:12px;color:var(--text-muted);background:none;border:none;cursor:pointer;
    text-decoration:underline;font-family:inherit;
  }
  .edit-field{margin-bottom:10px;}
  .edit-field label{display:block;font-size:12px;color:var(--text-secondary);margin-bottom:4px;}
  .edit-field input[type="text"], .edit-field textarea{
    width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;
    font-size:13px;font-family:inherit;background:var(--bg);color:var(--text);
  }
  .edit-field textarea{resize:vertical;}
  .edit-items{display:flex;flex-direction:column;gap:6px;margin:6px 0 12px;}
  .edit-items-label{font-size:12px;color:var(--text-secondary);margin-bottom:2px;}
  .edit-item-row{display:flex;gap:6px;align-items:center;}
  .edit-item-row input[type="text"]{
    flex:2;min-width:0;padding:6px 8px;font-size:12px;border:1px solid var(--border);
    border-radius:6px;background:var(--bg);color:var(--text);font-family:inherit;
  }
  .edit-item-row input[type="number"]{
    width:60px;padding:6px 6px;font-size:12px;border:1px solid var(--border);
    border-radius:6px;background:var(--bg);color:var(--text);font-family:inherit;
  }
  .edit-item-row .remove-item-btn{
    border:none;background:none;color:var(--text-muted);font-size:16px;cursor:pointer;
    padding:2px 6px;flex-shrink:0;
  }
  .add-item-btn{margin-bottom:12px;}
  .edit-total{font-size:13px;color:var(--text-secondary);margin:0 0 12px;}
  .edit-total strong{color:var(--accent);font-size:15px;}
  .sync-card{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:14px;margin-bottom:18px;
  }
  .sync-row{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
  .sync-row input{
    flex:1;min-width:160px;padding:9px 10px;border:1px solid var(--border);border-radius:8px;
    font-size:12px;font-family:inherit;background:var(--bg);color:var(--text);
  }
  .sync-row input:focus{outline:none;border-color:var(--accent);}
  .sync-status-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .sync-status{font-size:12px;color:var(--text-muted);}
  .sync-status.connected{color:var(--status-paid);}
  .sync-status.error{color:var(--accent);}
  .lightbox{
    position:fixed;inset:0;background:rgba(0,0,0,0.75);display:flex;align-items:center;
    justify-content:center;padding:20px;z-index:100;
  }
  .lightbox[hidden]{display:none;}
  .lightbox-inner{max-width:100%;max-height:100%;display:flex;flex-direction:column;gap:12px;align-items:center;}
  .lightbox-inner img{max-width:100%;max-height:70vh;border-radius:8px;background:#fff;}
  .lightbox-actions{display:flex;gap:10px;}
  .lightbox-actions a, .lightbox-actions button{
    padding:10px 16px;border-radius:var(--radius);border:1px solid var(--border);
    background:var(--card);color:var(--text);font-size:13px;cursor:pointer;text-decoration:none;
    font-family:inherit;
  }
</style>
</head>
<body>
<div class="container">
  <div class="top-nav">
    <a class="back-link" href="index.html">← กลับไปหน้าเครื่องคิดราคา</a>
  </div>
  <h1>รายการลูกค้า</h1>
  <p class="subtitle">รายการทั้งหมดจากการบันทึกภาพ เรียงตามลำดับที่บันทึก</p>

  <div class="sync-card">
    <div class="sync-row">
      <input type="text" id="syncUrlInput" placeholder="วาง URL ของ Google Apps Script Web App">
      <button class="icon-btn" id="syncSaveBtn" type="button">บันทึก URL</button>
    </div>
    <div class="sync-status-row">
      <span class="sync-status" id="syncStatus">ยังไม่ได้เชื่อมต่อ (ใช้ข้อมูลในเครื่องนี้เท่านั้น)</span>
      <button class="icon-btn" id="syncNowBtn" type="button" hidden>ซิงก์ตอนนี้</button>
      <button class="icon-btn" id="syncDisconnectBtn" type="button" hidden>เลิกเชื่อมต่อ</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat-card"><div class="stat-value" id="statTotal">0</div><div class="stat-label">ทั้งหมด</div></div>
    <div class="stat-card"><div class="stat-value" id="statProgress">0</div><div class="stat-label">กำลังดำเนินการ</div></div>
    <div class="stat-card"><div class="stat-value" id="statDone">0</div><div class="stat-label">สำเร็จ</div></div>
    <div class="stat-card"><div class="stat-value" id="statCancelled">0</div><div class="stat-label">ยกเลิก</div></div>
    <div class="stat-card"><div class="stat-value" id="statPaid">0</div><div class="stat-label">ได้รับเงินแล้ว</div></div>
    <div class="stat-card"><div class="stat-value" id="statShipped">0</div><div class="stat-label">จัดส่งแล้ว</div></div>
  </div>

  <div class="revenue-card">
    <div class="revenue-label">ยอดรวมทั้งหมด</div>
    <div class="revenue-value" id="revenueTotal">0 บาท</div>
    <div class="revenue-hint">ไม่รวมรายการที่ยกเลิก</div>
  </div>

  <div class="controls">
    <input type="text" id="searchInput" placeholder="ค้นหาชื่อลูกค้า">
    <button class="sort-btn" id="sortBtn" type="button">ใหม่ก่อน</button>
    <button class="sort-btn" id="exportBtn" type="button">ส่งออก CSV</button>
  </div>
  <div class="controls filter-row">
    <select id="filterOrderStatus" class="filter-select">
      <option value="all">สถานะงาน: ทั้งหมด</option>
      <option value="in_progress">กำลังดำเนินการ</option>
      <option value="done">สำเร็จ</option>
      <option value="cancelled">ยกเลิก</option>
    </select>
    <select id="filterPaymentStatus" class="filter-select">
      <option value="all">การชำระเงิน: ทั้งหมด</option>
      <option value="paid">ได้รับเงินแล้ว</option>
      <option value="unpaid">ยังไม่ได้รับเงิน</option>
    </select>
    <select id="filterShippingStatus" class="filter-select">
      <option value="all">การจัดส่ง: ทั้งหมด</option>
      <option value="shipped">จัดส่งแล้ว</option>
      <option value="not_shipped">ยังไม่จัดส่ง</option>
    </select>
  </div>

  <div id="orderList" class="order-list"></div>

  <div class="clear-all-row">
    <button id="clearAllBtn" type="button">ล้างรายการลูกค้าทั้งหมด</button>
  </div>
</div>

<div id="lightbox" class="lightbox" hidden>
  <div class="lightbox-inner">
    <img id="lightboxImg" src="" alt="">
    <div class="lightbox-actions">
      <a id="lightboxDownload" download="order.png">ดาวน์โหลด</a>
      <button id="lightboxClose" type="button">ปิด</button>
    </div>
  </div>
</div>

<script>
const ORDERS_KEY = 'badgeCalcOrders';
const ORDER_STATUS_LABELS = { in_progress: 'กำลังดำเนินการ', done: 'สำเร็จ', cancelled: 'ยกเลิก' };
const PAYMENT_STATUS_LABELS = { paid: 'ได้รับเงินแล้ว', unpaid: 'ยังไม่ได้รับเงิน' };
const SHIPPING_STATUS_LABELS = { shipped: 'จัดส่งแล้ว', not_shipped: 'ยังไม่จัดส่ง' };
const BRANCH_LABELS = { navy: 'ทหารเรือ', army: 'ทหารบก', police: 'ตำรวจ', airforce: 'ทหารอากาศ' };

function migrateOrder(o){
  // Back-compat for orders saved before order/payment/shipping were split into separate fields.
  if(!o.orderStatus) o.orderStatus = o.status === 'cancelled' ? 'cancelled' : 'in_progress';
  if(!o.paymentStatus) o.paymentStatus = o.status === 'paid' ? 'paid' : 'unpaid';
  if(!o.shippingStatus) o.shippingStatus = o.status === 'shipped' ? 'shipped' : 'not_shipped';
  delete o.status;
  return o;
}

function loadOrders(){
  try{
    const data = JSON.parse(localStorage.getItem(ORDERS_KEY) || '[]');
    return Array.isArray(data) ? data.map(migrateOrder) : [];
  }catch(e){ return []; }
}
function saveOrders(list){
  localStorage.setItem(ORDERS_KEY, JSON.stringify(list));
}

let orders = loadOrders();
saveOrders(orders); // persist migrated field names (orderStatus/paymentStatus/shippingStatus) right away
let searchTerm = '';
let orderStatusFilter = 'all';
let paymentStatusFilter = 'all';
let shippingStatusFilter = 'all';
let sortDesc = true;
let editingId = null;
let editDraft = null;

const SYNC_URL_KEY = 'badgeCalcSyncUrl';
let syncUrl = localStorage.getItem(SYNC_URL_KEY) || '';

function updateSyncUi(){
  document.getElementById('syncUrlInput').value = syncUrl;
  const statusEl = document.getElementById('syncStatus');
  const nowBtn = document.getElementById('syncNowBtn');
  const disconnectBtn = document.getElementById('syncDisconnectBtn');
  if(syncUrl){
    statusEl.textContent = 'เชื่อมต่อ Google Sheets แล้ว';
    statusEl.className = 'sync-status connected';
    nowBtn.hidden = false;
    disconnectBtn.hidden = false;
  } else {
    statusEl.textContent = 'ยังไม่ได้เชื่อมต่อ (ใช้ข้อมูลในเครื่องนี้เท่านั้น)';
    statusEl.className = 'sync-status';
    nowBtn.hidden = true;
    disconnectBtn.hidden = true;
  }
}

async function callApi(action, payload){
  if(!syncUrl) return null;
  try{
    const res = await fetch(syncUrl, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(Object.assign({action: action}, payload || {}))
    });
    return await res.json();
  }catch(e){
    console.error('sync error', e);
    return {error: String(e)};
  }
}

async function pullFromServer(showAlertOnError){
  const statusEl = document.getElementById('syncStatus');
  statusEl.textContent = 'กำลังซิงก์...';
  statusEl.className = 'sync-status';
  const data = await callApi('list');
  if(!data || data.error){
    statusEl.textContent = 'ซิงก์ไม่สำเร็จ (ตรวจสอบ URL หรืออินเทอร์เน็ต)';
    statusEl.className = 'sync-status error';
    if(showAlertOnError) alert('ซิงก์ไม่สำเร็จ: ' + (data && data.error ? data.error : 'ไม่ทราบสาเหตุ'));
    return false;
  }
  orders = (data.orders || []).map(migrateOrder);
  saveOrders(orders);
  statusEl.textContent = 'เชื่อมต่อ Google Sheets แล้ว (ซิงก์ล่าสุด ' +
    new Date().toLocaleTimeString('th-TH', {hour: '2-digit', minute: '2-digit'}) + ')';
  statusEl.className = 'sync-status connected';
  render();
  return true;
}

document.getElementById('syncSaveBtn').addEventListener('click', async () => {
  const url = document.getElementById('syncUrlInput').value.trim();
  syncUrl = url;
  if(url) localStorage.setItem(SYNC_URL_KEY, url); else localStorage.removeItem(SYNC_URL_KEY);
  updateSyncUi();
  if(url) await pullFromServer(true);
});
document.getElementById('syncNowBtn').addEventListener('click', () => pullFromServer(true));
document.getElementById('syncDisconnectBtn').addEventListener('click', () => {
  if(!confirm('เลิกเชื่อมต่อ Google Sheets? (ข้อมูลในเครื่องนี้ยังอยู่)')) return;
  syncUrl = '';
  localStorage.removeItem(SYNC_URL_KEY);
  updateSyncUi();
});

function fmt(n){ return Math.round(n || 0).toLocaleString('th-TH'); }
function formatDate(iso){
  const d = new Date(iso);
  if(isNaN(d.getTime())) return '';
  return d.toLocaleDateString('th-TH', {day:'numeric', month:'short', year:'numeric'}) +
    ' ' + d.toLocaleTimeString('th-TH', {hour:'2-digit', minute:'2-digit'});
}

function updateStatusField(id, field, value){
  const order = orders.find(o => o.id === id);
  if(!order) return;
  order[field] = value;
  saveOrders(orders);
  render();
  if(syncUrl) callApi('update', {id: id, patch: {[field]: value}});
}

function deleteOrder(id){
  if(!confirm('ลบรายการนี้หรือไม่?')) return;
  orders = orders.filter(o => o.id !== id);
  saveOrders(orders);
  render();
  if(syncUrl) callApi('delete', {id: id});
}

document.getElementById('clearAllBtn').addEventListener('click', () => {
  if(orders.length === 0) return;
  if(!confirm('ล้างรายการลูกค้าทั้งหมดหรือไม่? ไม่สามารถย้อนกลับได้')) return;
  orders = [];
  editingId = null;
  editDraft = null;
  saveOrders(orders);
  render();
  if(syncUrl) callApi('clearAll');
});

document.getElementById('searchInput').addEventListener('input', (e) => {
  searchTerm = e.target.value.trim().toLowerCase();
  render();
});

document.getElementById('filterOrderStatus').addEventListener('change', (e) => {
  orderStatusFilter = e.target.value;
  render();
});
document.getElementById('filterPaymentStatus').addEventListener('change', (e) => {
  paymentStatusFilter = e.target.value;
  render();
});
document.getElementById('filterShippingStatus').addEventListener('change', (e) => {
  shippingStatusFilter = e.target.value;
  render();
});

const sortBtn = document.getElementById('sortBtn');
sortBtn.addEventListener('click', () => {
  sortDesc = !sortDesc;
  sortBtn.textContent = sortDesc ? 'ใหม่ก่อน' : 'เก่าก่อน';
  render();
});

function matchesFilter(o){
  if(orderStatusFilter !== 'all' && o.orderStatus !== orderStatusFilter) return false;
  if(paymentStatusFilter !== 'all' && o.paymentStatus !== paymentStatusFilter) return false;
  if(shippingStatusFilter !== 'all' && o.shippingStatus !== shippingStatusFilter) return false;
  if(searchTerm && !(o.customerName || '').toLowerCase().includes(searchTerm)) return false;
  return true;
}

function getVisibleOrders(){
  let filtered = orders.filter(matchesFilter);
  filtered = filtered.slice().sort((a, b) => sortDesc ? b.seq - a.seq : a.seq - b.seq);
  return filtered;
}

function csvEscape(val){
  const s = String(val == null ? '' : val);
  if(/[",\r\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}

document.getElementById('exportBtn').addEventListener('click', () => {
  const list = getVisibleOrders();
  if(list.length === 0){ alert('ไม่มีรายการให้ส่งออก'); return; }
  const rows = [['ลำดับ', 'วันที่', 'ชื่อลูกค้า', 'เบอร์โทร', 'ที่อยู่จัดส่ง', 'เหล่า', 'รายการสินค้า', 'ยอดรวม', 'สถานะงาน', 'การชำระเงิน', 'การจัดส่ง']];
  list.forEach(o => {
    rows.push([
      o.seq,
      formatDate(o.createdAt),
      o.customerName || '',
      o.phone || '',
      (o.address || '').replace(/\r?\n/g, ' '),
      o.branchLabel || BRANCH_LABELS[o.branch] || '',
      (o.items || []).map(it => it.name + ' x' + it.qty).join('; '),
      o.total,
      ORDER_STATUS_LABELS[o.orderStatus] || o.orderStatus,
      PAYMENT_STATUS_LABELS[o.paymentStatus] || o.paymentStatus,
      SHIPPING_STATUS_LABELS[o.shippingStatus] || o.shippingStatus
    ]);
  });
  const csv = rows.map(r => r.map(csvEscape).join(',')).join('\r\n');
  const blob = new Blob(['﻿' + csv], {type: 'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = 'customers-' + Date.now() + '.csv';
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
});

function openLightbox(src){
  document.getElementById('lightboxImg').src = src;
  document.getElementById('lightboxDownload').href = src;
  document.getElementById('lightbox').hidden = false;
}
document.getElementById('lightboxClose').addEventListener('click', () => {
  document.getElementById('lightbox').hidden = true;
});
document.getElementById('lightbox').addEventListener('click', (e) => {
  if(e.target.id === 'lightbox') document.getElementById('lightbox').hidden = true;
});

function startEdit(o){
  editingId = o.id;
  editDraft = {
    customerName: o.customerName || '',
    phone: o.phone || '',
    address: o.address || '',
    items: (o.items || []).map(it => ({name: it.name, price: it.price, qty: it.qty}))
  };
  render();
}

function cancelEdit(){
  editingId = null;
  editDraft = null;
  render();
}

function saveEdit(id){
  const order = orders.find(o => o.id === id);
  if(!order || !editDraft) return;
  order.customerName = editDraft.customerName.trim();
  order.phone = editDraft.phone.trim();
  order.address = editDraft.address.trim();
  order.items = editDraft.items
    .map(it => ({name: (it.name || '').trim() || 'รายการ', price: Number(it.price) || 0, qty: Math.max(0, Math.round(Number(it.qty) || 0))}))
    .filter(it => it.qty > 0);
  order.total = order.items.reduce((sum, it) => sum + it.price * it.qty, 0);
  saveOrders(orders);
  editingId = null;
  editDraft = null;
  render();
  if(syncUrl){
    callApi('update', {id: id, patch: {
      customerName: order.customerName, phone: order.phone, address: order.address,
      items: order.items, total: order.total
    }});
  }
}

  card.className = 'order-card';
  const itemsSummary = (o.items || []).map(it => it.name + ' ×' + it.qty).join(', ');
  const contactParts = [];
  if(o.phone) contactParts.push('โทร: ' + o.phone);
  if(o.address) contactParts.push('ที่อยู่: ' + o.address);
  card.innerHTML =
    '<div class="order-top">' +
      '<div class="order-meta">' +
        '<span class="order-seq">#' + o.seq + '</span>' +
        '<span class="order-date">' + formatDate(o.createdAt) + '</span>' +
      '</div>' +
      '<div class="badge-row">' +
        '<span class="status-badge order-' + o.orderStatus + '">' + (ORDER_STATUS_LABELS[o.orderStatus] || o.orderStatus) + '</span>' +
        '<span class="status-badge payment-' + o.paymentStatus + '">' + (PAYMENT_STATUS_LABELS[o.paymentStatus] || o.paymentStatus) + '</span>' +
        '<span class="status-badge shipping-' + o.shippingStatus + '">' + (SHIPPING_STATUS_LABELS[o.shippingStatus] || o.shippingStatus) + '</span>' +
      '</div>' +
    '</div>' +
    '<div class="order-body">' +
      (o.image ? '<img class="order-thumb" data-role="thumb" src="' + o.image + '" alt="">' : '') +
      '<div class="order-info">' +
        '<p class="order-name">' + (o.customerName || '-') + '</p>' +
        '<p class="order-branch">เหล่า: ' + (o.branchLabel || BRANCH_LABELS[o.branch] || '-') + '</p>' +
        (contactParts.length ? '<p class="order-contact">' + contactParts.join(' · ') + '</p>' : '') +
        (itemsSummary ? '<p class="order-items">' + itemsSummary + '</p>' : '') +
        '<p class="order-total">' + fmt(o.total) + ' บาท</p>' +
      '</div>' +
    '</div>' +
    '<div class="order-actions">' +
      '<select class="status-select" data-role="orderStatusSelect">' +
        '<option value="in_progress">กำลังดำเนินการ</option>' +
        '<option value="done">สำเร็จ</option>' +
        '<option value="cancelled">ยกเลิก</option>' +
      '</select>' +
      '<select class="status-select" data-role="paymentStatusSelect">' +
        '<option value="unpaid">ยังไม่ได้รับเงิน</option>' +
        '<option value="paid">ได้รับเงินแล้ว</option>' +
      '</select>' +
      '<select class="status-select" data-role="shippingStatusSelect">' +
        '<option value="not_shipped">ยังไม่จัดส่ง</option>' +
        '<option value="shipped">จัดส่งแล้ว</option>' +
      '</select>' +
      '<button class="icon-btn" data-role="editBtn" type="button">แก้ไข</button>' +
      '<button class="icon-btn danger" data-role="deleteBtn" type="button">ลบ</button>' +
    '</div>';

  const orderStatusSelect = card.querySelector('[data-role="orderStatusSelect"]');
  orderStatusSelect.value = o.orderStatus;
  orderStatusSelect.addEventListener('change', () => updateStatusField(o.id, 'orderStatus', orderStatusSelect.value));
  const paymentStatusSelect = card.querySelector('[data-role="paymentStatusSelect"]');
  paymentStatusSelect.value = o.paymentStatus;
  paymentStatusSelect.addEventListener('change', () => updateStatusField(o.id, 'paymentStatus', paymentStatusSelect.value));
  const shippingStatusSelect = card.querySelector('[data-role="shippingStatusSelect"]');
  shippingStatusSelect.value = o.shippingStatus;
  shippingStatusSelect.addEventListener('change', () => updateStatusField(o.id, 'shippingStatus', shippingStatusSelect.value));
  card.querySelector('[data-role="editBtn"]').addEventListener('click', () => startEdit(o));
  card.querySelector('[data-role="deleteBtn"]').addEventListener('click', () => deleteOrder(o.id));
  const thumb = card.querySelector('[data-role="thumb"]');
  if(thumb) thumb.addEventListener('click', () => openLightbox(o.image));
  return card;
}

function buildEditCard(o){
  const card = document.createElement('div');
  card.className = 'order-card';

  const topHtml =
    '<div class="order-top">' +
      '<div class="order-meta">' +
        '<span class="order-seq">#' + o.seq + '</span>' +
        '<span class="order-date">' + formatDate(o.createdAt) + '</span>' +
      '</div>' +
      '<div class="badge-row">' +
        '<span class="status-badge order-' + o.orderStatus + '">' + (ORDER_STATUS_LABELS[o.orderStatus] || o.orderStatus) + '</span>' +
        '<span class="status-badge payment-' + o.paymentStatus + '">' + (PAYMENT_STATUS_LABELS[o.paymentStatus] || o.paymentStatus) + '</span>' +
        '<span class="status-badge shipping-' + o.shippingStatus + '">' + (SHIPPING_STATUS_LABELS[o.shippingStatus] || o.shippingStatus) + '</span>' +
      '</div>' +
    '</div>';

  card.innerHTML = topHtml +
    '<div class="edit-field"><label>ชื่อลูกค้า</label><input type="text" data-role="editName"></div>' +
    '<div class="edit-field"><label>เบอร์โทร</label><input type="text" data-role="editPhone"></div>' +
    '<div class="edit-field"><label>ที่อยู่จัดส่ง</label><textarea data-role="editAddress" rows="2"></textarea></div>' +
    '<div class="edit-items-label">รายการสินค้า</div>' +
    '<div class="edit-items" data-role="editItems"></div>' +
    '<button type="button" class="icon-btn add-item-btn" data-role="addItemBtn">+ เพิ่มรายการ</button>' +
    '<p class="edit-total">ยอดรวม: <strong data-role="editTotal">0</strong> บาท</p>' +
    '<div class="order-actions">' +
      '<button class="icon-btn primary-btn" data-role="saveEditBtn" type="button">บันทึก</button>' +
      '<button class="icon-btn" data-role="cancelEditBtn" type="button">ยกเลิกแก้ไข</button>' +
    '</div>';

  const nameInput = card.querySelector('[data-role="editName"]');
  const phoneInput = card.querySelector('[data-role="editPhone"]');
  const addressInput = card.querySelector('[data-role="editAddress"]');
  const itemsWrap = card.querySelector('[data-role="editItems"]');
  const totalEl = card.querySelector('[data-role="editTotal"]');

  nameInput.value = editDraft.customerName;
  phoneInput.value = editDraft.phone;
  addressInput.value = editDraft.address;
  nameInput.addEventListener('input', () => { editDraft.customerName = nameInput.value; });
  phoneInput.addEventListener('input', () => { editDraft.phone = phoneInput.value; });
  addressInput.addEventListener('input', () => { editDraft.address = addressInput.value; });

  function updateTotal(){
    const total = editDraft.items.reduce((sum, it) => sum + (Number(it.price) || 0) * (Number(it.qty) || 0), 0);
    totalEl.textContent = fmt(total);
  }

  function renderItemRows(){
    itemsWrap.innerHTML = '';
    editDraft.items.forEach((it, idx) => {
      const row = document.createElement('div');
      row.className = 'edit-item-row';
      row.innerHTML =
        '<input type="text" data-role="itemName" value="' + it.name.replace(/"/g, '&quot;') + '">' +
        '<input type="number" data-role="itemPrice" min="0" step="1" value="' + it.price + '">' +
        '<input type="number" data-role="itemQty" min="0" step="1" value="' + it.qty + '">' +
        '<button type="button" class="remove-item-btn" data-role="removeItem" aria-label="ลบรายการ">×</button>';
      row.querySelector('[data-role="itemName"]').addEventListener('input', (e) => { it.name = e.target.value; });
      row.querySelector('[data-role="itemPrice"]').addEventListener('input', (e) => { it.price = Number(e.target.value) || 0; updateTotal(); });
      row.querySelector('[data-role="itemQty"]').addEventListener('input', (e) => { it.qty = Number(e.target.value) || 0; updateTotal(); });
      row.querySelector('[data-role="removeItem"]').addEventListener('click', () => {
        editDraft.items.splice(idx, 1);
        renderItemRows();
        updateTotal();
      });
      itemsWrap.appendChild(row);
    });
  }

  card.querySelector('[data-role="addItemBtn"]').addEventListener('click', () => {
    editDraft.items.push({name: 'รายการใหม่', price: 0, qty: 1});
    renderItemRows();
    updateTotal();
  });

  card.querySelector('[data-role="saveEditBtn"]').addEventListener('click', () => saveEdit(o.id));
  card.querySelector('[data-role="cancelEditBtn"]').addEventListener('click', cancelEdit);

  renderItemRows();
  updateTotal();
  return card;
}

function render(){
  const total = orders.length;
  const counts = {in_progress: 0, done: 0, cancelled: 0, paid: 0, shipped: 0};
  let revenue = 0;
  orders.forEach(o => {
    counts[o.orderStatus] = (counts[o.orderStatus] || 0) + 1;
    if(o.paymentStatus === 'paid') counts.paid++;
    if(o.shippingStatus === 'shipped') counts.shipped++;
    if(o.orderStatus !== 'cancelled') revenue += Number(o.total) || 0;
  });
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statProgress').textContent = counts.in_progress;
  document.getElementById('statDone').textContent = counts.done;
  document.getElementById('statCancelled').textContent = counts.cancelled;
  document.getElementById('statPaid').textContent = counts.paid;
  document.getElementById('statShipped').textContent = counts.shipped;
  document.getElementById('revenueTotal').textContent = fmt(revenue) + ' บาท';

  const filtered = getVisibleOrders();

  const list = document.getElementById('orderList');
  list.innerHTML = '';
  if(filtered.length === 0){
    list.innerHTML = '<p class="empty-state">' + (orders.length === 0 ? 'ยังไม่มีรายการลูกค้า' : 'ไม่พบรายการที่ตรงกับเงื่อนไข') + '</p>';
    return;
  }
  filtered.forEach(o => {
    list.appendChild(o.id === editingId ? buildEditCard(o) : buildViewCard(o));
  });
}

updateSyncUi();
render();
if(syncUrl) pullFromServer(false);
</script>
